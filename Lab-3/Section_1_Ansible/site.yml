---
- name: Configure web server
  hosts: webservers
  become: yes
  tasks:
    - name: Install nginx
      apt:
        name: nginx
        state: present
        update_cache: yes
    - name: Create web page
      copy:
        dest: /var/www/html/index.html
        content: "<h1>DevOps Lab 3 - Ansible Configuration Successful</h1>"
